name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Bundles for workerd without deploying (catches Node-only imports in Worker code).
      - run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run --env staging
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: PW_CHROMIUM="$(node -e "console.log(require('playwright-core').chromium.executablePath())")" npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
      # Lighthouse mobile against a production build (SPEC §15: target ≥ 90).
      - run: npm run build
      - run: |
          (npm run dev:api > api.log 2>&1 &)
          (npx vite preview --port 4173 --strictPort > preview.log 2>&1 &)
          npx wait-on -t 60000 http://127.0.0.1:8790/api/health http://127.0.0.1:4173/
          npx -y lighthouse@13.5.0 http://localhost:4173/ --form-factor=mobile --quiet \
            --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=lh.json \
            --only-categories=performance,accessibility,best-practices,seo
          node -e "const c=require('./lh.json').categories;for(const k in c)console.log(k,Math.round(c[k].score*100))"

  # Staging deploy runs only after the owner creates the remote resources and sets the repo
  # variable STAGING_DEPLOY_ENABLED=true. Production is never deployed from CI.
  deploy-staging:
    needs: [check, e2e]
    if: github.ref == 'refs/heads/main' && vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Docker is available here, so the scanner image (ClamAV) is built and rolled out too.
      - run: ZK_CONTAINERS=1 node scripts/gen-wrangler.mjs > wrangler.jsonc
      - run: npx wrangler d1 migrations apply DB --env staging --remote
      - run: npx wrangler deploy --env staging
