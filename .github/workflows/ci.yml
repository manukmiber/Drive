name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Bundles for workerd without deploying (catches Node-only imports in Worker code).
      - run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run --env staging
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  # Staging deploy runs only after the owner creates the remote resources and sets the repo
  # variable STAGING_DEPLOY_ENABLED=true. Production is never deployed from CI.
  deploy-staging:
    needs: check
    if: github.ref == 'refs/heads/main' && vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Docker is available here, so the scanner image (ClamAV) is built and rolled out too.
      - run: ZK_CONTAINERS=1 node scripts/gen-wrangler.mjs > wrangler.jsonc
      - run: npx wrangler d1 migrations apply DB --env staging --remote
      - run: npx wrangler deploy --env staging
